flows:
  - id: assignment-transfer-review
    file: flows/assignment-transfer-review.flow.md
    purpose: "Review a lease or interest assignment package before a record update."
  - id: division-order-preparation
    file: flows/division-order-preparation.flow.md
    purpose: "Reconcile ownership evidence and prepare a production-interest draft for approval."
  - id: land-package-review
    file: flows/land-package-review.flow.md
    purpose: "Triage a land package and route bounded lease, interest, and evidence review."
  - id: lease-lifecycle-review
    file: flows/lease-lifecycle-review.flow.md
    purpose: "Extract lease lifecycle obligations and route timing and evidence exceptions."
  - id: parcel-transfer-review
    file: flows/parcel-transfer-review.flow.md
    purpose: "Review a parcel transfer through intake, parallel specialist skills, and human confirmation."
  - id: wv-land-well-reconciliation
    file: flows/wv-land-well-reconciliation.flow.md
    purpose: "Reconcile submitted well clues with independent public evidence and route uncertainty."

human_control:
  required_before:
    - "legal interpretation or title certification"
    - "payment setup or change"
    - "filing, registry update, or owner communication"
    - "marking an obligation satisfied, waived, or in default"
