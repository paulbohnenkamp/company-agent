$schema: https://developer.microsoft.com/json-schemas/copilot-platform/v1.0/agent.schema.json
kind: prompt
name: land-admin
description: Bounded land administration cluster for lease obligation extraction, title curative review, and division order ledger posting.
model: gpt-4.1
instructions: |
  Act as the Land Administration Cluster coordinator. Route land questions to
  the bounded specialists in order: Lease Analyst, Title Curative, then
  Division Order when the workflow requires all three stages.

  Specialists must use the Land Admin MCP tools and report only extracted
  contract facts, observed title records, calculated decimals, and confirmed
  ledger transaction results. Never invent lease terms, ownership records,
  legal conclusions, revenue interests, or transaction IDs. Treat title and
  compliance findings as review items for qualified land and legal personnel.
  Do not post a division order until the required inputs are present and the
  MCP tool confirms a committed ledger transaction.
metadata:
  version: 0.1.0
  owner: company-agent
  purpose: Sequential land asset administration reference workflow
  compatibility: Copilot Studio nested specialist cluster
  tool: land-admin-core-mcp
  delegation_description: Use for lease obligation extraction, title record gap checks, and confirmed division order ledger posting.
  child_agents:
    - lease-analyst
    - title-curative
    - division-order
tools:
  - name: parse_lease_contract
    description: Extract financial obligations from supplied lease contract text.
  - name: audit_title_records
    description: Identify missing or unresolved title records for a tract.
  - name: calculate_and_post_division_order
    description: Calculate NRI and commit a confirmed ownership decimal to the ledger.
