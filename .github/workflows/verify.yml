name: verify

on:
  push:
  pull_request:

jobs:
  repository-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate:records
      - run: npm run validate:agent-artifacts
      - run: npm run validate:identity-personas
      - run: npm run validate:naming

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore dotnet/LandOps.sln
      - run: dotnet build dotnet/LandOps.sln --no-restore
      - run: dotnet test dotnet/LandOps.sln --no-build --no-restore
