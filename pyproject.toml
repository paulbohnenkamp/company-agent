[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "company-agent-reference"
version = "0.1.0"
description = "Python-first reference implementation for the Company Agent composition"
requires-python = ">=3.10"
dependencies = [
    "fastmcp==2.14.7",
    "httpx==0.28.1",
    "pydantic>=2.10,<3",
    "pyyaml==6.0.2",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.4.2",
    "pytest-asyncio==1.4.0",
]
orchestration = [
    "anthropic>=0.25,<1",
    "openai>=1.0,<2",
]

[project.scripts]
customer-mcp = "customer_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools]
packages = ["customer_mcp", "it_request_workflow"]
